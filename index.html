<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>Buchstaben-Bingo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    /* ══ SCREENS ══ */
    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .screen.hidden { display: none; }

    /* ── Startscreen ── */
    #screenStart {
      background: #c92b2b;
      -webkit-tap-highlight-color: transparent;
    }
    #btnStart {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      background: transparent;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #screenStart h1 {
      color: #fff;
      font-size: clamp(2.8rem, 11vw, 7rem);
      font-weight: 900;
      text-align: center;
      padding: 1rem;
      text-shadow: 0 4px 18px rgba(0,0,0,.25);
      pointer-events: none;
      position: relative; z-index: 1;
    }
    #screenStart p {
      color: rgba(255,255,255,.75);
      font-size: clamp(1rem, 3.5vw, 2rem);
      margin-top: 1rem;
      text-align: center;
      pointer-events: none;
      position: relative; z-index: 1;
    }

    /* ── Buchstaben-Screen ── */
    #screenLetter { background: #fff; }

    #bigLetter {
      font-size: clamp(12rem, 48vw, 52rem);
      font-weight: 900;
      line-height: 1;
      color: #0b0b0b;
      transition: opacity 0.1s;
    }
    #bigLetter.rolling { opacity: 0.25; }

    /* ── Weiter-Button ── */
    #btnWeiter {
      position: fixed;
      right: 1rem; bottom: 1rem;
      width: clamp(80px, 18vw, 110px);
      height: clamp(80px, 18vw, 110px);
      border-radius: 20px;
      background: linear-gradient(180deg, #003366, #001f3a);
      color: #fff;
      border: 4px solid #fff;
      font-weight: 900;
      font-size: clamp(0.95rem, 2.5vw, 1.2rem);
      box-shadow: 0 10px 28px rgba(0,0,0,.4);
      z-index: 9999;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #btnWeiter.hidden { display: none; }

    /* ── Einstellungen-Button ── */
    #btnSettings {
      position: fixed;
      left: 1rem; bottom: 1rem;
      width: clamp(64px, 14vw, 84px);
      height: clamp(64px, 14vw, 84px);
      border-radius: 16px;
      background: rgba(0,0,0,.5);
      color: #fff;
      border: 3px solid rgba(255,255,255,.3);
      font-size: clamp(1.4rem, 4vw, 2rem);
      box-shadow: 0 6px 18px rgba(0,0,0,.3);
      z-index: 9999;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Drawer ── */
    #drawer {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 10000;
      display: flex; align-items: flex-end;
    }
    #drawer.hidden { display: none; }
    #drawerInner {
      width: 100%;
      background: #f6f8fa;
      border-radius: 22px 22px 0 0;
      padding: 1.4rem 1.4rem 2.6rem;
      display: flex; flex-direction: column; gap: 1.2rem;
      max-height: 82vh; overflow-y: auto;
    }
    #drawerInner h2 {
      font-size: 1.2rem; font-weight: 800; color: #111;
      border-bottom: 2px solid rgba(0,0,0,.08);
      padding-bottom: 0.5rem;
    }
    .setting-row { display: flex; flex-direction: column; gap: 0.35rem; }
    .setting-row label { font-weight: 700; font-size: 1rem; color: #222; }
    .setting-row input[type=range] {
      width: 100%; height: 34px;
      accent-color: #003366; cursor: pointer;
    }
    .tiny { font-size: 0.85rem; color: #555; }

    /* ── Buchstaben-Anzeige ── */
    .drawn-header {
      display: flex; align-items: center;
      justify-content: space-between; gap: 0.8rem;
    }
    .drawn-header label { font-weight: 700; font-size: 1rem; color: #222; }
    #btnReset {
      padding: 10px 18px; border-radius: 12px; border: none;
      background: #b22222; color: #fff;
      font-weight: 700; font-size: 0.95rem;
      cursor: pointer; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap; flex-shrink: 0;
    }
    #drawnLetters {
      display: flex; flex-wrap: wrap; gap: 0.45rem;
      min-height: 2.5rem;
    }
    .drawn-chip {
      background: #003366; color: #fff;
      font-weight: 900; font-size: 1.1rem;
      width: 2.4rem; height: 2.4rem;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    #drawnEmpty {
      font-size: 0.88rem; color: #999; align-self: center;
    }

    /* ── Schließen-Button ── */
    #btnCloseDrawer {
      align-self: flex-end;
      padding: 10px 20px; border-radius: 12px; border: none;
      background: #003366; color: #fff;
      font-weight: 700; font-size: 1rem;
      cursor: pointer; touch-action: manipulation;
    }

    /* ── Alle-gezogen-Banner ── */
    #alleDone {
      position: fixed; inset: 0;
      background: #003366; color: #fff;
      font-size: clamp(1.6rem, 6vw, 3.2rem);
      font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      text-align: center; padding: 2rem; z-index: 8000;
    }
    #alleDone.hidden { display: none; }
    #alleDone span {
      font-size: 0.55em; font-weight: 400; margin-top: 1rem;
    }
  </style>
</head>
<body>

  <!-- ① Startscreen -->
  <div id="screenStart" class="screen">
    <button id="btnStart" aria-label="Buchstaben würfeln"></button>
    <h1>Bitte berühren</h1>
    <p>Tippe, um einen Buchstaben zu würfeln</p>
  </div>

  <!-- ② Buchstaben-Screen -->
  <div id="screenLetter" class="screen hidden" aria-live="polite">
    <div id="bigLetter"></div>
  </div>

  <!-- Alle gezogen -->
  <div id="alleDone" class="hidden">
    Alle 26 Buchstaben wurden gezogen! 🎉
    <span>Drücke „Weiter", um neu zu starten.</span>
  </div>

  <!-- Weiter -->
  <button id="btnWeiter" class="hidden" aria-label="Nächste Runde">Weiter</button>

  <!-- Einstellungen -->
  <button id="btnSettings" aria-label="Einstellungen">⚙️</button>

  <!-- Drawer -->
  <div id="drawer" class="hidden" role="dialog" aria-modal="true">
    <div id="drawerInner">
      <button id="btnCloseDrawer">✕ Schließen</button>
      <h2>⚙️ Einstellungen</h2>

      <!-- Bisherige Buchstaben + Reset -->
      <div class="setting-row">
        <div class="drawn-header">
          <label>🔤 Bisherige Buchstaben</label>
          <button id="btnReset">↺ Zurücksetzen</button>
        </div>
        <div id="drawnLetters">
          <span id="drawnEmpty">Noch keine Buchstaben gezogen.</span>
        </div>
      </div>

      <!-- Sprechrate -->
      <div class="setting-row">
        <label for="rateRange">🔊 Sprechrate</label>
        <input id="rateRange" type="range" min="0.4" max="1.4" step="0.05" value="0.65"/>
        <div class="tiny" id="rateVal">Rate: 0.65 (langsam)</div>
      </div>

      <!-- Lautstärke -->
      <div class="setting-row">
        <label for="volRange">🔈 Lautstärke</label>
        <input id="volRange" type="range" min="0.1" max="1.0" step="0.05" value="1.0"/>
        <div class="tiny" id="volVal">Lautstärke: 100 %</div>
      </div>

    </div>
  </div>

<script>
"use strict";

/* ══ Konstanten ══ */
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const ROLL_MS = [28,54,82,112,144,178,214,252,292,334,378,424];

/* ══ State ══ */
let drawn         = new Set();
let rolling       = false;
let currentLetter = "";
let speechRate    = 0.65;
let speechVol     = 1.0;

/* ══ DOM ══ */
const screenStart  = document.getElementById("screenStart");
const screenLetter = document.getElementById("screenLetter");
const bigLetter    = document.getElementById("bigLetter");
const btnStart     = document.getElementById("btnStart");
const btnWeiter    = document.getElementById("btnWeiter");
const btnSettings  = document.getElementById("btnSettings");
const drawer       = document.getElementById("drawer");
const alleDone     = document.getElementById("alleDone");
const drawnLetters = document.getElementById("drawnLetters");
const drawnEmpty   = document.getElementById("drawnEmpty");

/* ══ Bisherige Buchstaben rendern ══ */
function renderDrawn() {
  // Alle Chips entfernen (aber drawnEmpty im DOM lassen)
  [...drawnLetters.querySelectorAll(".drawn-chip")].forEach(c => c.remove());

  if (drawn.size === 0) {
    drawnEmpty.style.display = "";
  } else {
    drawnEmpty.style.display = "none";
    // In Reihenfolge des Alphabets anzeigen
    LETTERS.filter(l => drawn.has(l)).forEach(l => {
      const chip = document.createElement("div");
      chip.className = "drawn-chip";
      chip.textContent = l;
      drawnLetters.appendChild(chip);
    });
  }
}

/* ══ Reset ══ */
document.getElementById("btnReset").addEventListener("click", () => {
  if (drawn.size === 0) return;
  if (!confirm("Alle bisherigen Buchstaben zurücksetzen?")) return;
  drawn.clear();
  currentLetter = "";
  alleDone.classList.add("hidden");
  renderDrawn();
});

/* ══ Speech ══ */
function speak(letter) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();

  const utt = new SpeechSynthesisUtterance(letter.toLowerCase());
  utt.lang   = "de-DE";
  utt.rate   = speechRate;
  utt.volume = speechVol;
  utt.pitch  = 1.0;

  const voices = window.speechSynthesis.getVoices();
  const de = voices.find(v => /^de/i.test(v.lang));
  if (de) utt.voice = de;

  window.speechSynthesis.speak(utt);
}

/* ══ Screens ══ */
function showScreen(name) {
  screenStart .classList.toggle("hidden", name !== "start");
  screenLetter.classList.toggle("hidden", name !== "letter");
}

/* ══ Würfeln ══ */
btnStart.addEventListener("click", () => {
  if (rolling) return;
  if (drawn.size >= LETTERS.length) {
    alleDone.classList.remove("hidden");
    btnWeiter.classList.remove("hidden");
    return;
  }

  rolling = true;
  showScreen("letter");
  btnWeiter.classList.add("hidden");
  bigLetter.classList.add("rolling");

  const frames = ROLL_MS.length;
  let   idx    = 0;
  const start  = performance.now();

  function animate(now) {
    if (idx < frames - 1) {
      if (now - start >= ROLL_MS[idx]) {
        bigLetter.textContent = LETTERS[Math.floor(Math.random() * LETTERS.length)];
        idx++;
      }
      requestAnimationFrame(animate);
    } else {
      const remaining = LETTERS.filter(l => !drawn.has(l));
      const final     = remaining[Math.floor(Math.random() * remaining.length)];
      drawn.add(final);
      currentLetter = final;

      bigLetter.classList.remove("rolling");
      bigLetter.textContent = final;
      rolling = false;
      btnWeiter.classList.remove("hidden");

      speak(final);
    }
  }
  requestAnimationFrame(animate);
});

/* ══ Weiter ══ */
btnWeiter.addEventListener("click", () => {
  if (rolling) return;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  alleDone.classList.add("hidden");
  showScreen("start");
  btnWeiter.classList.add("hidden");
});

/* ══ Einstellungen-Drawer ══ */
btnSettings.addEventListener("click", () => {
  renderDrawn();
  drawer.classList.remove("hidden");
});
document.getElementById("btnCloseDrawer").addEventListener("click", () => {
  drawer.classList.add("hidden");
});
drawer.addEventListener("click", e => {
  if (e.target === drawer) drawer.classList.add("hidden");
});

/* ══ Schieberegler ══ */
document.getElementById("rateRange").addEventListener("input", e => {
  speechRate = parseFloat(e.target.value);
  const label = speechRate <= 0.55 ? "sehr langsam"
              : speechRate <= 0.75 ? "langsam"
              : speechRate <= 1.05 ? "normal" : "schnell";
  document.getElementById("rateVal").textContent =
    `Rate: ${speechRate.toFixed(2)} (${label})`;
});
document.getElementById("volRange").addEventListener("input", e => {
  speechVol = parseFloat(e.target.value);
  document.getElementById("volVal").textContent =
    `Lautstärke: ${Math.round(speechVol * 100)} %`;
});

/* ══ Tastatur ══ */
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !screenStart.classList.contains("hidden")) {
    e.preventDefault(); btnStart.click();
  }
  if ((e.key === "r" || e.key === "R") && !screenLetter.classList.contains("hidden")) {
    btnWeiter.click();
  }
});

/* ══ Init ══ */
window.addEventListener("load", () => {
  showScreen("start");
  if ("speechSynthesis" in window) window.speechSynthesis.getVoices();
});
</script>
</body>
</html>
