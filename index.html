<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>Buchstaben-Bingo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
      background: #c92b2b;
    }

    /* ══════════════════════════════
       SCREENS  –  je ein <div>
    ══════════════════════════════ */
    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 0.25s;
    }
    .screen.hidden { opacity: 0; pointer-events: none; }

    /* ── 1. Startscreen (rot) ── */
    #screenStart {
      background: #c92b2b;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #screenStart h1 {
      color: #fff;
      font-size: clamp(2.4rem, 10vw, 6rem);
      font-weight: 900;
      text-align: center;
      padding: 1rem;
      text-shadow: 0 4px 18px rgba(0,0,0,.25);
    }
    #screenStart p {
      color: rgba(255,255,255,.75);
      font-size: clamp(1rem, 3.5vw, 1.8rem);
      margin-top: 1rem;
      text-align: center;
    }

    /* ── 2. Würfel-Screen (weiß) ── */
    #screenLetter {
      background: #fff;
    }
    #bigLetter {
      font-size: clamp(10rem, 45vw, 48rem);
      font-weight: 900;
      line-height: 1;
      color: #0b0b0b;
      pointer-events: none;
      transition: opacity 0.15s;
    }
    #bigLetter.rolling { opacity: 0.35; }

    /* ── Weiter-Button ── */
    #btnWeiter {
      position: fixed;
      right: 1rem; bottom: 1rem;
      width: clamp(80px, 18vw, 110px);
      height: clamp(80px, 18vw, 110px);
      border-radius: 20px;
      background: linear-gradient(180deg, #003366, #001f3a);
      color: #fff;
      border: 4px solid #fff;
      font-weight: 900;
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      box-shadow: 0 10px 28px rgba(0,0,0,.4);
      z-index: 9999;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
    }
    #btnWeiter.hidden { opacity: 0; pointer-events: none; }

    /* ── Einstellungen-Button ── */
    #btnSettings {
      position: fixed;
      left: 1rem; bottom: 1rem;
      width: clamp(64px, 14vw, 84px);
      height: clamp(64px, 14vw, 84px);
      border-radius: 16px;
      background: rgba(0,0,0,.55);
      color: #fff;
      border: 3px solid rgba(255,255,255,.35);
      font-size: clamp(1.4rem, 4vw, 2rem);
      box-shadow: 0 6px 18px rgba(0,0,0,.3);
      z-index: 9999;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Einstellungen-Drawer ── */
    #drawer {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 10000;
      display: flex; align-items: flex-end;
      transition: opacity 0.25s;
    }
    #drawer.hidden { opacity: 0; pointer-events: none; }
    #drawerInner {
      width: 100%;
      background: #f6f8fa;
      border-radius: 22px 22px 0 0;
      padding: 1.4rem 1.4rem 2.4rem;
      display: flex; flex-direction: column; gap: 1.2rem;
      max-height: 80vh; overflow-y: auto;
    }
    #drawerInner h2 {
      font-size: 1.2rem; font-weight: 800; color: #111;
      border-bottom: 2px solid rgba(0,0,0,.08);
      padding-bottom: 0.5rem;
    }
    .setting-row { display: flex; flex-direction: column; gap: 0.3rem; }
    .setting-row label { font-weight: 700; font-size: 1rem; color: #222; }
    .setting-row input[type=range] {
      width: 100%; height: 32px;
      accent-color: #003366; cursor: pointer;
    }
    .setting-row .tiny { font-size: 0.85rem; color: #555; }

    .btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .btn-sm {
      padding: 12px 16px; border-radius: 12px; border: none;
      background: #003366; color: #fff;
      font-weight: 700; font-size: 0.95rem;
      cursor: pointer; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-sm.danger { background: #b22222; }
    .btn-sm:disabled { opacity: 0.4; pointer-events: none; }

    #logView {
      display: none; white-space: pre-wrap;
      background: #fff; border: 2px solid rgba(0,0,0,.08);
      border-radius: 10px; padding: 0.7rem;
      max-height: 180px; overflow-y: auto;
      font-size: 0.82rem; color: #222;
    }
    #recState { font-size: 0.88rem; color: #444; }

    #btnCloseDrawer {
      align-self: flex-end;
      padding: 10px 18px; border-radius: 12px; border: none;
      background: #003366; color: #fff;
      font-weight: 700; font-size: 1rem;
      cursor: pointer; touch-action: manipulation;
    }

    /* ── Alle-gezogen-Banner ── */
    #alleDone {
      position: fixed; inset: 0;
      background: #003366;
      color: #fff;
      font-size: clamp(1.6rem, 6vw, 3.2rem);
      font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      z-index: 8000;
    }
    #alleDone.hidden { display: none; }
  </style>
</head>
<body>

  <!-- ① Startscreen -->
  <div id="screenStart" class="screen" role="button" tabindex="0"
       aria-label="Buchstaben würfeln starten">
    <h1>Bitte berühren</h1>
    <p>Tippe, um einen Buchstaben zu würfeln</p>
  </div>

  <!-- ② Buchstaben-Screen -->
  <div id="screenLetter" class="screen hidden" aria-live="polite">
    <div id="bigLetter"></div>
  </div>

  <!-- Alle gezogen -->
  <div id="alleDone" class="hidden">
    Alle 26 Buchstaben wurden gezogen! 🎉<br>
    <span style="font-size:0.6em;font-weight:400;margin-top:0.8rem;display:block">
      Drücke Weiter, um neu zu starten.
    </span>
  </div>

  <!-- Weiter-Button -->
  <button id="btnWeiter" class="hidden" aria-label="Nächste Runde">Weiter</button>

  <!-- Einstellungen-Button -->
  <button id="btnSettings" aria-label="Einstellungen">⚙️</button>

  <!-- Einstellungen-Drawer -->
  <div id="drawer" class="hidden" role="dialog" aria-modal="true" aria-label="Einstellungen">
    <div id="drawerInner">
      <button id="btnCloseDrawer">✕ Schließen</button>
      <h2>⚙️ Einstellungen</h2>

      <div class="setting-row">
        <label for="rateRange">🔊 Sprechrate</label>
        <input id="rateRange" type="range" min="0.4" max="1.4" step="0.05" value="0.85"/>
        <div class="tiny" id="rateVal">Rate: 0.85 (langsam)</div>
      </div>

      <div class="setting-row">
        <label for="volRange">🔈 Lautstärke</label>
        <input id="volRange" type="range" min="0.1" max="1.0" step="0.05" value="1.0"/>
        <div class="tiny" id="volVal">Lautstärke: 100 %</div>
      </div>

      <div class="setting-row">
        <label>📋 Protokoll</label>
        <div class="tiny">Einträge: <strong id="logCount">0</strong></div>
        <div class="btn-row" style="margin-top:0.4rem">
          <button class="btn-sm" id="btnDownload">CSV ↓</button>
          <button class="btn-sm" id="btnShowLog">Zeigen</button>
          <button class="btn-sm danger" id="btnClearLog">Löschen</button>
        </div>
        <pre id="logView"></pre>
      </div>

      <div class="setting-row">
        <label>🎙 Tonaufnahme</label>
        <div class="btn-row">
          <button class="btn-sm" id="btnRecStart">▶ Start</button>
          <button class="btn-sm danger" id="btnRecStop" disabled>■ Stop</button>
        </div>
        <div id="recState">Aufnahme: aus</div>
      </div>

    </div>
  </div>

<script>
"use strict";

/* ══ Konstanten ══ */
const LETTERS    = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const DEBOUNCE   = 700;
const ROLL_COUNT = 12;
const LOG_KEY    = "bingo_log_v3";

/* ══ State ══ */
let drawn      = new Set();
let rolling    = false;
let lastTap    = 0;
let speechRate = 0.85;
let speechVol  = 1.0;

/* ══ DOM ══ */
const screenStart  = document.getElementById("screenStart");
const screenLetter = document.getElementById("screenLetter");
const bigLetter    = document.getElementById("bigLetter");
const btnWeiter    = document.getElementById("btnWeiter");
const btnSettings  = document.getElementById("btnSettings");
const drawer       = document.getElementById("drawer");
const alleDone     = document.getElementById("alleDone");

const rateRange    = document.getElementById("rateRange");
const volRange     = document.getElementById("volRange");
const rateVal      = document.getElementById("rateVal");
const volVal       = document.getElementById("volVal");
const logCount     = document.getElementById("logCount");
const logView      = document.getElementById("logView");
const btnDownload  = document.getElementById("btnDownload");
const btnShowLog   = document.getElementById("btnShowLog");
const btnClearLog  = document.getElementById("btnClearLog");
const btnRecStart  = document.getElementById("btnRecStart");
const btnRecStop   = document.getElementById("btnRecStop");
const recState     = document.getElementById("recState");
const btnCloseDrawer = document.getElementById("btnCloseDrawer");

/* ══ MediaRecorder ══ */
let mediaRecorder  = null;
let recordedChunks = [];

/* ══════════════════════════════════════════
   SAFARI / iOS SPEECH FIX
   ─────────────────────────────────────────
   Safari erlaubt speechSynthesis nur nach
   einem echten User-Gesture. Wir spielen
   beim allerersten Tap ein komplett stilles
   Utterance ab – das öffnet den Audio-
   Kontext. Danach funktioniert speak().
══════════════════════════════════════════ */
let audioUnlocked = false;

function unlockAudio() {
  if (audioUnlocked || !("speechSynthesis" in window)) return;
  audioUnlocked = true;
  const u = new SpeechSynthesisUtterance(" ");
  u.volume = 0;
  u.lang   = "de-DE";
  window.speechSynthesis.speak(u);
}

/* ══════════════════════════════════════════
   SPRACHAUSGABE
   Kleinbuchstabe → iOS sagt kein
   "Großbuchstabe X" mehr
══════════════════════════════════════════ */
function speak(letter) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();

  const utt  = new SpeechSynthesisUtterance(letter.toLowerCase());
  utt.lang   = "de-DE";
  utt.rate   = speechRate;
  utt.volume = speechVol;
  utt.pitch  = 1.0;

  // Warte kurz bis Stimmen geladen (nötig auf iOS)
  function doSpeak() {
    const voices = window.speechSynthesis.getVoices();
    const de = voices.find(v => /^de/i.test(v.lang));
    if (de) utt.voice = de;
    window.speechSynthesis.speak(utt);
  }

  // Stimmen schon geladen? Sonst warten.
  if (window.speechSynthesis.getVoices().length > 0) {
    doSpeak();
  } else {
    window.speechSynthesis.addEventListener("voiceschanged", doSpeak, { once: true });
  }
}

/* ══════════════════════════════════════════
   SCREENS
══════════════════════════════════════════ */
function showScreen(name) {
  screenStart .classList.toggle("hidden", name !== "start");
  screenLetter.classList.toggle("hidden", name !== "letter");
}

/* ══════════════════════════════════════════
   STARTSCREEN → Würfeln
══════════════════════════════════════════ */
screenStart.addEventListener("pointerdown", e => {
  e.preventDefault();
  unlockAudio();   // ← MUSS synchron im User-Gesture sein

  const now = Date.now();
  if (now - lastTap < DEBOUNCE) return;
  lastTap = now;

  if (rolling) return;
  startRoll();
});

/* ══════════════════════════════════════════
   WÜRFEL-ANIMATION
══════════════════════════════════════════ */
async function startRoll() {
  if (rolling) return;

  if (drawn.size >= LETTERS.length) {
    alleDone.classList.remove("hidden");
    btnWeiter.classList.remove("hidden");
    return;
  }

  rolling = true;
  showScreen("letter");
  btnWeiter.classList.add("hidden");
  bigLetter.classList.add("rolling");

  for (let i = 0; i < ROLL_COUNT; i++) {
    bigLetter.textContent = LETTERS[Math.floor(Math.random() * LETTERS.length)];
    await wait(28 + i * 26);
  }

  const remaining = LETTERS.filter(l => !drawn.has(l));
  const final     = remaining[Math.floor(Math.random() * remaining.length)];
  drawn.add(final);

  bigLetter.classList.remove("rolling");
  bigLetter.textContent = final;
  rolling = false;

  addLog(final);
  btnWeiter.classList.remove("hidden");

  // Sprechen mit kurzem Versatz (Animation abgeschlossen)
  setTimeout(() => speak(final), 250);
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ══════════════════════════════════════════
   WEITER-BUTTON
══════════════════════════════════════════ */
btnWeiter.addEventListener("pointerdown", e => {
  e.stopPropagation();
  if (rolling) return;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  alleDone.classList.add("hidden");
  showScreen("start");
  btnWeiter.classList.add("hidden");
  updateLogCount();
});

/* ══════════════════════════════════════════
   EINSTELLUNGEN-DRAWER
══════════════════════════════════════════ */
btnSettings.addEventListener("pointerdown", e => {
  e.stopPropagation();
  drawer.classList.remove("hidden");
  updateLogCount();
});
btnCloseDrawer.addEventListener("pointerdown", e => {
  e.stopPropagation();
  drawer.classList.add("hidden");
});
// Tap auf dunklen Hintergrund schließt Drawer
drawer.addEventListener("pointerdown", e => {
  if (e.target === drawer) drawer.classList.add("hidden");
});

/* ══════════════════════════════════════════
   SCHIEBEREGLER
══════════════════════════════════════════ */
rateRange.addEventListener("input", () => {
  speechRate = parseFloat(rateRange.value);
  const label = speechRate <= 0.65 ? "sehr langsam"
              : speechRate <= 0.85 ? "langsam"
              : speechRate <= 1.05 ? "normal" : "schnell";
  rateVal.textContent = `Rate: ${speechRate.toFixed(2)} (${label})`;
});
volRange.addEventListener("input", () => {
  speechVol = parseFloat(volRange.value);
  volVal.textContent = `Lautstärke: ${Math.round(speechVol * 100)} %`;
});

/* ══════════════════════════════════════════
   PROTOKOLL
══════════════════════════════════════════ */
function loadLog()      { try { return JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); } catch { return []; } }
function saveLog(arr)   { try { localStorage.setItem(LOG_KEY, JSON.stringify(arr)); } catch {} }
function addLog(letter) { const a = loadLog(); a.push({ ts: new Date().toISOString(), letter }); saveLog(a); updateLogCount(); }
function updateLogCount() { logCount.textContent = loadLog().length; }

btnDownload.addEventListener("click", () => {
  const rows = loadLog();
  if (!rows.length) { alert("Noch kein Protokoll vorhanden."); return; }
  const csv  = ["timestamp,letter", ...rows.map(r => `${r.ts},${r.letter}`)].join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url  = URL.createObjectURL(blob);
  Object.assign(document.createElement("a"), { href: url, download: "bingo_log.csv" }).click();
  URL.revokeObjectURL(url);
});

btnShowLog.addEventListener("click", () => {
  if (logView.style.display === "block") {
    logView.style.display  = "none";
    btnShowLog.textContent = "Zeigen";
  } else {
    const rows = loadLog();
    logView.textContent    = rows.length ? rows.map(r => `${r.ts}  →  ${r.letter}`).join("\n") : "(leer)";
    logView.style.display  = "block";
    btnShowLog.textContent = "Verstecken";
  }
});

btnClearLog.addEventListener("click", () => {
  if (!confirm("Protokoll wirklich löschen?")) return;
  localStorage.removeItem(LOG_KEY);
  logView.style.display  = "none";
  btnShowLog.textContent = "Zeigen";
  updateLogCount();
});

/* ══════════════════════════════════════════
   TONAUFNAHME
══════════════════════════════════════════ */
btnRecStart.addEventListener("click", async () => {
  if (!navigator.mediaDevices?.getUserMedia) { alert("Keine Audioaufnahme verfügbar."); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];
    mediaRecorder  = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: "audio/webm" });
      const url  = URL.createObjectURL(blob);
      recState.innerHTML = `Fertig – <a href="${url}" download="bingo.webm">Herunterladen</a>`;
    };
    mediaRecorder.start();
    recState.textContent  = "🔴 Aufnahme läuft …";
    btnRecStart.disabled  = true;
    btnRecStop.disabled   = false;
  } catch (err) { alert("Mikrofon: " + err.message); }
});

btnRecStop.addEventListener("click", () => {
  if (mediaRecorder?.state !== "inactive") {
    mediaRecorder.stop();
    btnRecStart.disabled = false;
    btnRecStop.disabled  = true;
  }
});

/* ══════════════════════════════════════════
   TASTATUR (Desktop)
══════════════════════════════════════════ */
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !screenStart.classList.contains("hidden")) {
    e.preventDefault(); startRoll();
  }
  if ((e.key === "r" || e.key === "R") && !screenLetter.classList.contains("hidden")) {
    showScreen("start"); btnWeiter.classList.add("hidden");
  }
});

/* ══ Init ══ */
window.addEventListener("load", () => {
  showScreen("start");
  updateLogCount();
  if ("speechSynthesis" in window) window.speechSynthesis.getVoices();
});
</script>
</body>
</html>
