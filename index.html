<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>Buchstaben-Bingo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      font-family: system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .screen.hidden { display: none; }

    #screenStart { background: #c92b2b; }
    #screenStart h1 {
      color: #fff; font-size: clamp(2.8rem,11vw,7rem);
      font-weight: 900; text-align: center; padding: 1rem;
      pointer-events: none;
    }
    #screenStart p {
      color: rgba(255,255,255,.75);
      font-size: clamp(1rem,3.5vw,2rem);
      margin-top: 1rem; text-align: center;
      pointer-events: none;
    }
    #startCount {
      position: absolute; top: 1.2rem; left: 0; right: 0;
      margin-top: 0; font-size: clamp(.9rem,2.8vw,1.4rem);
    }
    #startCount.hidden { display: none; }
    #btnStart {
      position: absolute; inset: 0;
      background: transparent; border: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #screenLetter { background: #2a7d2e; }
    #bigLetter {
      font-size: clamp(12rem,48vw,52rem);
      font-weight: 900; line-height: 1; color: #fff;
      pointer-events: none;
      transition: opacity 0.1s;
    }
    #bigLetter.rolling { opacity: 0.2; }

    #btnWeiter {
      position: fixed; right: 1rem; bottom: 1rem;
      width: clamp(80px,18vw,110px); height: clamp(80px,18vw,110px);
      border-radius: 20px;
      background: linear-gradient(180deg,#c92b2b,#8b0000);
      color: #fff; border: 4px solid #fff;
      font-weight: 900; font-size: clamp(.95rem,2.5vw,1.2rem);
      box-shadow: 0 10px 28px rgba(0,0,0,.4);
      z-index: 9999; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #btnWeiter.hidden { display: none; }

    #btnSettings {
      position: fixed; left: 1rem; bottom: 1rem;
      width: clamp(64px,14vw,84px); height: clamp(64px,14vw,84px);
      border-radius: 16px; background: rgba(0,0,0,.3);
      color: #fff; border: 3px solid rgba(255,255,255,.3);
      font-size: clamp(1.4rem,4vw,2rem);
      z-index: 9999; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #repeatHint {
      position: fixed; bottom: 7rem; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.6); color: #fff;
      font-size: 1rem; font-weight: 700;
      padding: .4rem 1rem; border-radius: 20px;
      opacity: 0; transition: opacity .2s;
      pointer-events: none; z-index: 8000;
    }
    #repeatHint.show { opacity: 1; }

    #drawer {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      z-index: 10000; display: flex; align-items: flex-end;
    }
    #drawer.hidden { display: none; }
    #drawerInner {
      width: 100%; background: #f6f8fa;
      border-radius: 22px 22px 0 0;
      padding: 1.4rem 1.4rem 2.6rem;
      display: flex; flex-direction: column; gap: 1.2rem;
      max-height: 82vh; overflow-y: auto;
    }
    #drawerInner h2 { font-size: 1.2rem; font-weight: 800; }
    .srow { display: flex; flex-direction: column; gap: .35rem; }
    .srow label, .srow .lbl { font-weight: 700; font-size: 1rem; }
    .tiny { font-size: .85rem; color: #555; }
    .drawn-header { display: flex; align-items: center; justify-content: space-between; }
    #btnReset {
      padding: 8px 16px; border-radius: 10px; border: none;
      background: #b22222; color: #fff; font-weight: 700; cursor: pointer;
    }
    #drawnLetters { display: flex; flex-wrap: wrap; gap: .4rem; min-height: 2.4rem; }
    .chip {
      background: #2a7d2e; color: #fff; font-weight: 900;
      width: 2.3rem; height: 2.3rem; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
    }
    #drawnEmpty { font-size: .85rem; color: #999; align-self: center; }
    #btnCloseDrawer {
      align-self: flex-end; padding: 10px 20px;
      border-radius: 12px; border: none;
      background: #2a7d2e; color: #fff; font-weight: 700; cursor: pointer;
    }

    #alleDone {
      position: fixed; inset: 0; background: #2a7d2e; color: #fff;
      font-size: clamp(1.6rem,6vw,3.2rem); font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; text-align: center; padding: 2rem;
      z-index: 8000;
    }
    #alleDone.hidden { display: none; }
    #alleDone span { font-size: .55em; font-weight: 400; margin-top: 1rem; }
  </style>
</head>
<body>

<div id="screenStart" class="screen">
  <button id="btnStart" aria-label="Buchstaben würfeln"></button>
  <h1>Bitte berühren</h1>
  <p>Tippe, um einen Buchstaben zu würfeln</p>
  <p id="startCount" class="hidden"></p>
</div>

<div id="screenLetter" class="screen hidden">
  <div id="bigLetter" aria-live="polite"></div>
</div>

<div id="repeatHint">🔊 Nochmal</div>

<div id="alleDone" class="hidden">
  Alle Buchstaben wurden gezogen! 🎉
  <span>Drücke „Weiter", um neu zu starten.</span>
</div>

<button id="btnWeiter" class="hidden">Weiter</button>
<button id="btnSettings" aria-label="Einstellungen">⚙️</button>

<div id="drawer" class="hidden">
  <div id="drawerInner">
    <button id="btnCloseDrawer">✕ Schließen</button>
    <h2>⚙️ Einstellungen</h2>
    <div class="srow">
      <div class="drawn-header">
        <span class="lbl">🔤 Bisherige Buchstaben</span>
        <button id="btnReset">↺ Zurücksetzen</button>
      </div>
      <div id="drawnLetters">
        <span id="drawnEmpty">Noch keine Buchstaben gezogen.</span>
      </div>
    </div>
    <div class="srow">
      <label for="volRange">🔈 Lautstärke</label>
      <input id="volRange" type="range" min="0.1" max="1.0" step="0.05" value="1.0"/>
      <div class="tiny" id="volVal">Lautstärke: 100 %</div>
    </div>
  </div>
</div>

<script>
"use strict";

const LETTERS   = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const ROLL_MS   = [28,54,82,112,144,178,214,252,292,334,378,424];
const STORE_KEY = "abcBingo.v1";

let drawn   = new Set();
let rolling = false;
let current = "";
let volume  = 1.0;
let hintTm  = null;

// ── Speichern / Laden ────────────────────────────────────────────────
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ drawn: [...drawn], volume }));
  } catch (e) {}
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!s) return;
    if (Array.isArray(s.drawn)) drawn = new Set(s.drawn.filter(l => LETTERS.includes(l)));
    if (typeof s.volume === "number") volume = Math.min(1, Math.max(0.1, s.volume));
  } catch (e) {}
}

// ── Audio ────────────────────────────────────────────────────────────
// Web Audio statt <audio>: Lautstärke funktioniert auch auf iOS, die Töne
// sind vorgeladen, und der Kontext wird direkt beim Tippen entsperrt,
// sodass der Ton nach der Würfel-Animation nicht blockiert wird.
let ctx           = null;
let gain          = null;
let source        = null;
let fallbackAudio = null;
const buffers     = {};

function initAudio() {
  if (ctx) {
    if (ctx.state !== "running") ctx.resume().catch(() => {});
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  // iOS 16.4+: auch bei Stummschalter abspielen, wie zuvor mit <audio>
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  ctx  = new AC();
  gain = ctx.createGain();
  gain.gain.value = volume;
  gain.connect(ctx.destination);
  // Stiller Puffer im Tipp-Handler entsperrt die Ausgabe auf iOS
  const unlock = ctx.createBufferSource();
  unlock.buffer = ctx.createBuffer(1, 1, 22050);
  unlock.connect(ctx.destination);
  unlock.start(0);
  if (ctx.state !== "running") ctx.resume().catch(() => {});
  LETTERS.forEach(l => {
    fetch(l + ".mp3")
      .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(data => new Promise((res, rej) => ctx.decodeAudioData(data, res, rej)))
      .then(buf => { buffers[l] = buf; })
      .catch(() => {});
  });
}

function stopAudio() {
  if (source) { try { source.stop(); } catch (e) {} source = null; }
  if (fallbackAudio) { fallbackAudio.pause(); fallbackAudio = null; }
}

function say(letter) {
  stopAudio();
  if (ctx && buffers[letter]) {
    source = ctx.createBufferSource();
    source.buffer = buffers[letter];
    source.connect(gain);
    source.start(0);
    return;
  }
  // Fallback: Datei noch nicht geladen oder kein Web Audio
  const audio = new Audio(letter + ".mp3");
  audio.volume = volume;
  audio.play().catch(() => {});
  fallbackAudio = audio;
}

// ── Hint ─────────────────────────────────────────────────────────────
function showHint() {
  const h = document.getElementById("repeatHint");
  h.classList.add("show");
  clearTimeout(hintTm);
  hintTm = setTimeout(() => h.classList.remove("show"), 800);
}

// ── Screen-Wechsel ───────────────────────────────────────────────────
function show(name) {
  document.getElementById("screenStart") .classList.toggle("hidden", name !== "start");
  document.getElementById("screenLetter").classList.toggle("hidden", name !== "letter");
}

// ── Zähler auf dem Startbildschirm ───────────────────────────────────
function renderCount() {
  const el = document.getElementById("startCount");
  el.textContent = `Bereits gezogen: ${drawn.size} von ${LETTERS.length}`;
  el.classList.toggle("hidden", drawn.size === 0);
}

// ── Drawn-Chips rendern ──────────────────────────────────────────────
function renderDrawn() {
  const box   = document.getElementById("drawnLetters");
  const empty = document.getElementById("drawnEmpty");
  box.querySelectorAll(".chip").forEach(c => c.remove());
  if (drawn.size === 0) { empty.style.display = ""; return; }
  empty.style.display = "none";
  LETTERS.filter(l => drawn.has(l)).forEach(l => {
    const d = document.createElement("div");
    d.className = "chip"; d.textContent = l;
    box.appendChild(d);
  });
}

// ── Neues Spiel ──────────────────────────────────────────────────────
function resetGame() {
  stopAudio();
  drawn.clear(); current = "";
  save();
  document.getElementById("alleDone").classList.add("hidden");
  document.getElementById("btnWeiter").classList.add("hidden");
  show("start");
  renderDrawn();
  renderCount();
}

// ── Würfeln ──────────────────────────────────────────────────────────
document.getElementById("btnStart").addEventListener("click", () => {
  if (rolling) return;
  initAudio();
  if (drawn.size >= LETTERS.length) {
    document.getElementById("alleDone").classList.remove("hidden");
    document.getElementById("btnWeiter").classList.remove("hidden");
    return;
  }

  rolling = true;
  stopAudio();
  show("letter");

  const bl = document.getElementById("bigLetter");
  const bw = document.getElementById("btnWeiter");
  bw.classList.add("hidden");
  bl.classList.add("rolling");

  let idx = 0;
  const t0 = performance.now();
  (function frame(now) {
    if (idx < ROLL_MS.length) {
      if (now - t0 >= ROLL_MS[idx]) {
        bl.textContent = LETTERS[Math.floor(Math.random() * LETTERS.length)];
        idx++;
      }
      requestAnimationFrame(frame);
    } else {
      const pool  = LETTERS.filter(l => !drawn.has(l));
      const final = pool[Math.floor(Math.random() * pool.length)];
      drawn.add(final);
      save();
      renderCount();
      current = final;
      bl.classList.remove("rolling");
      bl.textContent = final;
      rolling = false;
      bw.classList.remove("hidden");
      say(final);
    }
  })(performance.now());
});

// ── Wiederholen bei Tippen ───────────────────────────────────────────
document.getElementById("screenLetter").addEventListener("touchend", e => {
  if (rolling || !current) return;
  e.preventDefault();
  initAudio();
  say(current);
  showHint();
}, { passive: false });

document.getElementById("screenLetter").addEventListener("click", e => {
  if (rolling || !current) return;
  if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
  initAudio();
  say(current);
  showHint();
});

// ── Weiter ───────────────────────────────────────────────────────────
document.getElementById("btnWeiter").addEventListener("click", () => {
  if (rolling) return;
  if (!document.getElementById("alleDone").classList.contains("hidden")) {
    resetGame();
    return;
  }
  stopAudio();
  show("start");
  document.getElementById("btnWeiter").classList.add("hidden");
  current = "";
});

// ── Reset ────────────────────────────────────────────────────────────
document.getElementById("btnReset").addEventListener("click", () => {
  if (rolling || !drawn.size) return;
  if (!confirm("Zurücksetzen?")) return;
  resetGame();
});

// ── Drawer ───────────────────────────────────────────────────────────
document.getElementById("btnSettings").addEventListener("click", () => {
  renderDrawn();
  document.getElementById("drawer").classList.remove("hidden");
});
document.getElementById("btnCloseDrawer").addEventListener("click", () =>
  document.getElementById("drawer").classList.add("hidden"));
document.getElementById("drawer").addEventListener("click", e => {
  if (e.target === document.getElementById("drawer"))
    document.getElementById("drawer").classList.add("hidden");
});

// ── Lautstärke ───────────────────────────────────────────────────────
function renderVolume() {
  document.getElementById("volRange").value = volume;
  document.getElementById("volVal").textContent =
    `Lautstärke: ${Math.round(volume * 100)} %`;
}

document.getElementById("volRange").addEventListener("input", e => {
  volume = parseFloat(e.target.value);
  if (gain) gain.gain.value = volume;
  if (fallbackAudio) fallbackAudio.volume = volume;
  renderVolume();
  save();
});

// ── Init ─────────────────────────────────────────────────────────────
load();
renderVolume();
renderCount();
show("start");
</script>
</body>
</html>
